<div class="kp-table-scroll" tabindex="0" role="region" [attr.aria-label]="caption()">
  <table class="kp-table">
    <caption>{{ caption() }}</caption>
    <thead>
      <tr>
        @for (column of columns(); track column.key) {
          <th scope="col" [class.kp-table__numeric]="column.numeric">{{ column.label }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @if (rows().length === 0) {
        <tr>
          <td [attr.colspan]="columns().length">{{ emptyText() }}</td>
        </tr>
      } @else {
        @for (row of rows(); track $index) {
          <tr>
            @for (column of columns(); track column.key) {
              <td [class.kp-table__numeric]="column.numeric">{{ row[column.key] }}</td>
            }
          </tr>
        }
      }
    </tbody>
  </table>
</div>
